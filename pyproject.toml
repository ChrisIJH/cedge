[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedge"
version = "0.1.0"
description = "Cedge quant platform — core engine, services, and apps"
requires-python = ">=3.9"
dependencies = [
    "pandas==2.0.3",
    "numpy==1.23.5",
    "scipy==1.11.4",
    "sqlalchemy==2.0.35",
    "pymysql==1.1.1",
    "pyyaml==6.0",
    "cvxpy==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.2.1",
]
lint = [
    "ruff==0.16.7",
    "mypy==1.19.1",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs a live MySQL connection; excluded in CI, run locally",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "DTZ001",  # datetime without tzinfo — not meaningful for daily trading dates
    "DTZ011",  # date.today() without tzinfo — same
    "DTZ012",  # date.fromtimestamp() without tzinfo — same
    "UP045",   # Optional[X] -> X | None — style preference, not a 3.9 compatibility issue
    "UP006",   # List[X] -> list[X] — same
    "UP035",   # deprecated typing imports — same
    "UP007",   # Union[X, Y] -> X | Y — same
    "FA100",   # future-rewritable-type-annotation — same family
    "C408",    # dict()/list() calls instead of literals — style, not a bug
]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "pandas", "pandas.*", "numpy", "numpy.*", "sqlalchemy", "sqlalchemy.*", "yaml", "cvxpy", "cvxpy.*"]
ignore_missing_imports = true
follow_imports = "skip"