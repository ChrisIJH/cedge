[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedge"
version = "0.1.0"
description = "Cedge quant platform — core engine, services, and apps"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "scipy>=1.11",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a live MySQL connection; excluded in CI, run locally",
]